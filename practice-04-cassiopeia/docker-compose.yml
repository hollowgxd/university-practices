name: cassiopeia

networks: { backend: }
volumes: { pgdata: {}, appdata: {}, csvdata: {} }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: [pgdata:/var/lib/postgresql/data, ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    networks: [backend]
  rust_iss:
    build: ./services/rust-iss
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NASA_API_URL: ${NASA_API_URL:-https://visualization.osdr.nasa.gov/biodata/api/v2/datasets/?format=json}
      NASA_BASE_URL: ${NASA_BASE_URL:-https://api.nasa.gov}
      NASA_API_KEY: ${NASA_API_KEY:-}
      WHERE_ISS_URL: ${WHERE_ISS_URL:-https://api.wheretheiss.at/v1/satellites/25544}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      HTTP_RETRIES: ${HTTP_RETRIES:-2}
      FETCH_EVERY_SECONDS: ${FETCH_EVERY_SECONDS:-600}
      ISS_EVERY_SECONDS: ${ISS_EVERY_SECONDS:-120}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8081:3000"]
    networks: [backend]
  php:
    build: ./services/php-web
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RUST_BASE: http://rust_iss:3000
      JWST_HOST: ${JWST_HOST:-https://api.jwstapi.com}
      JWST_API_KEY: ${JWST_API_KEY:-}
      JWST_EMAIL: ${JWST_EMAIL:-}
    depends_on: { db: { condition: service_healthy }, rust_iss: { condition: service_started } }
    volumes: [appdata:/var/www/html, ./services/php-web/laravel-patches:/opt/laravel-patches:ro]
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [php]
    volumes: [appdata:/var/www/html:ro, ./services/php-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    networks: [backend]
  pascal_legacy:
    build: ./services/pascal-legacy-go
    environment:
      CSV_OUT_DIR: /data/csv
      GEN_PERIOD_SEC: ${PAS_LEGACY_PERIOD:-300}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on: { db: { condition: service_healthy } }
    volumes: [csvdata:/data/csv]
    networks: [backend]
