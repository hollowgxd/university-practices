[package]
name = "rust_iss"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7.9"
chrono = { version = "0.4.39", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono"] }
thiserror = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
